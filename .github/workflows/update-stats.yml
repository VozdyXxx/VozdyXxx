name: Generate Stats Card

on:
  schedule:
    - cron: '0 0 * * *'  # Обновляется каждый день в полночь
  workflow_dispatch:  # Можно запускать вручную
  push:
    branches: [ main ]

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Generate Stats Card
      run: |
        # Здесь можно добавить логику для динамического обновления цифр
        echo "Stats card updated!"
        
    - name: Commit changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add assets/stats-card.svg
        git diff --staged --quiet || git commit -m "Update stats card"
        git push